# Forgejo Actions.
#
# THIRD-PARTY ACTIONS ARE REFERENCED BY ABSOLUTE URL, and that is not a style
# choice. On Forgejo a bare `uses: owner/action@ref` is fetched from the
# INSTANCE's actions mirror (`DEFAULT_ACTIONS_URL`), not from GitHub - and the
# mirrors carry different subsets. Measured 2026-10-24 with `git ls-remote`:
#
#                                   code.forgejo.org   data.forgejo.org
#   actions/checkout                 resolves           resolves
#   astral-sh/setup-uv               MISSING            resolves
#   softprops/action-gh-release      MISSING            MISSING
#
# So a bare third-party reference works on one instance and fails on another,
# and the failure is a `git ls-remote` error naming the actions host - which
# reads as a network fault rather than as a missing mirror entry. An absolute
# URL depends on nothing an instance happens to mirror this month.
#
# `actions/*` stays BARE on purpose: Forgejo mirrors that family deliberately,
# so a bare reference there also works on an instance with no route to GitHub.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Bump, build, publish
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply"

      - uses: https://github.com/astral-sh/setup-uv@v7
        with:
          python-version: "[[ python_requires ]]"

      - name: Bump version
        id: bump
        run: |
          uvx --from commitizen cz bump --yes || EXIT=$?
          if [ "${EXIT:-0}" -eq 21 ] || [ "${EXIT:-0}" -eq 6 ]; then
            echo "No bumpable commits since last tag — skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "${EXIT:-0}" -eq 0 ] || exit $EXIT
          VERSION=$(cat VERSION)
          git push origin HEAD:main
          git push origin "v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.bump.outputs.skipped != 'true'
        run: uv build

      - name: Create Forgejo release
        if: steps.bump.outputs.skipped != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          curl -s -X POST "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"v${VERSION}\", \"name\": \"v${VERSION}\", \"body\": \"Release v${VERSION}\"}"
[% if enable_pypi_publishing %]

      - name: Publish to PyPI
        if: steps.bump.outputs.skipped != 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: uv publish
[% endif %]
