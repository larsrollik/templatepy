# Forgejo Actions.
#
# THIRD-PARTY ACTIONS ARE REFERENCED BY ABSOLUTE URL, and that is not a style
# choice. On Forgejo a bare `uses: owner/action@ref` is fetched from the
# INSTANCE's actions mirror (`DEFAULT_ACTIONS_URL`), not from GitHub - and the
# mirrors carry different subsets. Measured 2026-10-24 with `git ls-remote`:
#
#                                   code.forgejo.org   data.forgejo.org
#   actions/checkout                 resolves           resolves
#   astral-sh/setup-uv               MISSING            resolves
#   softprops/action-gh-release      MISSING            MISSING
#
# So a bare third-party reference works on one instance and fails on another,
# and the failure is a `git ls-remote` error naming the actions host - which
# reads as a network fault rather than as a missing mirror entry. An absolute
# URL depends on nothing an instance happens to mirror this month.
#
# `actions/*` stays BARE on purpose: Forgejo mirrors that family deliberately,
# so a bare reference there also works on an instance with no route to GitHub.
name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://github.com/astral-sh/setup-uv@v7
        with:
          python-version: "[[ python_requires ]]"

[% if private_repo_deps %]
      - name: Configure git for private repos
        env:
          PRIVATE_REPO_ACCESS_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_REPO_ACCESS_TOKEN" ]; then
            git config --global url."https://${PRIVATE_REPO_ACCESS_TOKEN}@${GITHUB_SERVER_URL#https://}/".insteadOf "${GITHUB_SERVER_URL}/"
          fi

[% endif %]
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pre-commit (ruff + mypy + commitizen + gitleaks)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (Python ${{ matrix.python-version }}[% if test_on_windows %] · ${{ matrix.os }}[% endif %])
    runs-on: [% if test_on_windows %]${{ matrix.os }}[% else %]ubuntu-latest[% endif %]
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
[% if test_on_windows %]
        os: [ubuntu-latest, windows-latest]
[% endif %]
[% if python_requires == "3.13" %]
        python-version: ["3.13"]
[% else %]
        python-version: ["[[ python_requires ]]", "3.13"]
[% endif %]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://github.com/astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

[% if private_repo_deps %]
      - name: Configure git for private repos
        env:
          PRIVATE_REPO_ACCESS_TOKEN: ${{ secrets.PRIVATE_REPO_ACCESS_TOKEN }}
        run: |
          if [ -n "$PRIVATE_REPO_ACCESS_TOKEN" ]; then
            git config --global url."https://${PRIVATE_REPO_ACCESS_TOKEN}@${GITHUB_SERVER_URL#https://}/".insteadOf "${GITHUB_SERVER_URL}/"
          fi

[% endif %]
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  # Aggregate gate — add as required status check in branch protection
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Check required jobs
        run: |
[% raw %]
          if [[ "${{ needs.lint.result }}" != "success" && "${{ needs.lint.result }}" != "skipped" ]]; then
            echo "lint failed" && exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "skipped" ]]; then
            echo "test failed" && exit 1
          fi
          echo "All required checks passed."
[% endraw -%]
