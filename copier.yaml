# templatepy — copier template configuration
# Usage: copier copy gh:larsrollik/templatepy my-new-project
# Update: copier update (inside an existing generated project)

_subdirectory: template
# Render every file's content. Template files carry no `.jinja` suffix; copier
# >=9.2 defaults `_templates_suffix` to ".jinja", which would copy files
# verbatim and leak literal [[ ]] tokens into generated projects.
_templates_suffix: ""
_min_copier_version: "9.0"
_answers_file: .copier-answers.yml

# Use [[ ]] delimiters in template files to avoid conflicts with
# GitHub Actions ${{ }} expression syntax.
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  # Keep each file's single trailing newline (Jinja strips it by default) so normal
  # files pass the end-of-file-fixer hook. Files that END with a block tag additionally
  # use `-%]` on that tag to swallow the extra newline (see LICENSE, the ci.yml files).
  keep_trailing_newline: true

# ---------------------------------------------------------------------------
# Questions
# ---------------------------------------------------------------------------

project_name:
  type: str
  help: "Human-readable project name (e.g. 'My Awesome Project')"

project_slug:
  type: str
  help: "Python package name — lowercase, underscores (e.g. 'my_awesome_project')"
  default: "[[ project_name | lower | replace(' ', '_') | replace('-', '_') ]]"

project_description:
  type: str
  help: "Short one-line description"

author_name:
  type: str
  help: "Your full name"
  default: "Lars B. Rollik"

author_email:
  type: str
  help: "Your email address"
  default: "lars@rollik.me"

github_username:
  type: str
  help: "GitHub username or organization"

github_repo:
  type: str
  help: "GitHub repository name"
  default: "[[ project_slug | replace('_', '-') ]]"

python_requires:
  type: str
  help: "Minimum Python version"
  default: "3.13"
  choices:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"

year:
  type: str
  help: "Copyright year"
  default: "[[ '%Y' | strftime ]]"

license_type:
  type: str
  help: "Licence for the generated project. noncommercial = BSD-3-Clause-NonCommercial (BSD-3 terms plus a non-commercial clause; research/academic/education only, commercial use needs a separate agreement). bsd3 = BSD-3-Clause (hardware wrappers and utilities — allows commercial use)."
  choices:
    "BSD-3 + non-commercial clause (default)": noncommercial
    "BSD-3-Clause (hardware wrappers / utilities)": bsd3
  default: noncommercial

private_repo_deps:
  type: bool
  help: "Does this project depend on private GitHub repos (git+ deps)? Adds a git-auth step to CI so it can clone them."
  default: false

private_repo_auth:
  type: str
  help: "How should CI authenticate to clone the private repos?"
  when: "[[ private_repo_deps ]]"
  default: app
  choices:
    # Org-owned GitHub App: per-run installation token, no user PAT. CI mints via
    # `client-id` (the App's Client ID, Iv23li…) + its private key, read from the
    # secrets named below (create the App with Contents:read on the repos and set
    # the secrets at org level). Recommended.
    "GitHub App (org-owned, per-run token)": app
    # Personal access token stored as the PRIVATE_REPO_ACCESS_TOKEN secret.
    "Personal access token (PRIVATE_REPO_ACCESS_TOKEN)": pat

ci_app_client_id_secret:
  type: str
  help: "Actions secret holding the GitHub App Client ID (Iv23li…) CI mints tokens with. Rename per org (e.g. MURINESHIFTWORK_CI_CLIENT_ID) or keep the generic default."
  when: "[[ private_repo_deps and private_repo_auth == 'app' ]]"
  default: CI_APP_CLIENT_ID

ci_app_private_key_secret:
  type: str
  help: "Actions secret holding the GitHub App private key (.pem) paired with that Client ID."
  when: "[[ private_repo_deps and private_repo_auth == 'app' ]]"
  default: CI_APP_PRIVATE_KEY

test_on_windows:
  type: bool
  help: "Add windows-latest to the CI test matrix? Enable for path-sensitive or Windows-targeted packages."
  default: false

enable_pypi_publishing:
  type: bool
  help: "Publish the package to PyPI from the release workflow? Off keeps GitHub/Forgejo releases but drops the PyPI publish step (and the OIDC id-token permission)."
  default: false

enable_docs_publishing:
  type: bool
  help: "Add the Docs workflow that deploys the MkDocs site to GitHub Pages on push? Off still ships mkdocs.yml + the docs deps (build locally with `mkdocs serve`); it only omits the publish workflow."
  default: false

enable_llm_pr_review:
  type: bool
  help: "Add the optional LLM PR-review workflow (Claude/Ollama, commented templates)? Off omits the workflow and its 'LLM review (not configured)' placeholder check."
  default: false
