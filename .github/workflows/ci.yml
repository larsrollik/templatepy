name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Validate copier.yaml syntax
        run: |
          uv run --with pyyaml python -c "import yaml; yaml.safe_load(open('copier.yaml'))"
          echo "copier.yaml: valid"

      - name: Check template structure
        run: |
          test -f template/pyproject.toml
          test -f template/VERSION
          test -f template/CITATION.cff
          test -f template/.pre-commit-config.yaml
          test -f "template/.github/workflows/ci.yml"
          test -f "template/.github/workflows/versioning.yml"
          test -f "template/.github/workflows/release.yml"
          echo "All expected template files present."

      - name: Validate template YAML files
        run: |
          uv run --with pyyaml python -c "
          import yaml, pathlib, sys
          errors = []
          for p in pathlib.Path('template').rglob('*.yml'):
              # Skip files with Jinja2 template syntax — not valid raw YAML
              text = p.read_text()
              if '[[' in text or '{%' in text:
                  continue
              try:
                  yaml.safe_load(text)
              except yaml.YAMLError as e:
                  errors.append(f'{p}: {e}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('All non-template YAML files valid.')
          "

      - name: Check key template content
        run: |
          # gitleaks via pre-commit, not standalone action
          grep -q "gitleaks" template/.pre-commit-config.yaml
          # commit-msg hooks present
          grep -q "fix-commit-msg" template/.pre-commit-config.yaml
          grep -q "gitlint" template/.pre-commit-config.yaml
          test -f template/.githooks/fix_commit_msg.py
          test -f template/.gitlint
          # OIDC publish, not token
          grep -q "trusted-publishing" template/.github/workflows/release.yml
          grep -q "id-token: write" template/.github/workflows/release.yml
          # no prod branch
          ! grep -q "prod" template/.github/workflows/release.yml
          # auto bump lives in versioning.yml (split from the publish-only release.yml)
          grep -q "startsWith.*bump:" template/.github/workflows/versioning.yml
          grep -q "cz bump" template/.github/workflows/versioning.yml
          echo "All content checks passed."

      - name: Generate test project (all optional features on)
        run: |
          # --vcs-ref HEAD: validate the pushed commit, not the latest git tag.
          # copier resolves a git source to its newest tag by default, which
          # would validate the last *released* version and never catch a new
          # break before it is tagged.
          # Enable the optional publish/review workflows so their files render
          # and get structure/YAML-checked below (the off path is checked after).
          uvx copier copy --vcs-ref HEAD . /tmp/test-output --defaults \
            --data "project_name=Test Project" \
            --data "project_slug=test_project" \
            --data "project_description=A test package" \
            --data "author_name=Test Author" \
            --data "author_email=test@example.com" \
            --data "github_username=testuser" \
            --data "github_repo=test-project" \
            --data "year=2026" \
            --data "enable_pypi_publishing=true" \
            --data "enable_docs_publishing=true" \
            --data "enable_llm_pr_review=true"

      - name: Check generated project structure
        run: |
          echo "=== generated files ===" && find /tmp/test-output -not -path '*/.git/*' | sort
          test -f /tmp/test-output/pyproject.toml       && echo "ok: pyproject.toml"
          test -f /tmp/test-output/VERSION               && echo "ok: VERSION"
          test -f /tmp/test-output/CITATION.cff          && echo "ok: CITATION.cff"
          test -f /tmp/test-output/.pre-commit-config.yaml && echo "ok: .pre-commit-config.yaml"
          test -f /tmp/test-output/.github/workflows/ci.yml         && echo "ok: ci.yml"
          test -f /tmp/test-output/.github/workflows/versioning.yml && echo "ok: versioning.yml"
          test -f /tmp/test-output/.github/workflows/release.yml    && echo "ok: release.yml"
          test -f /tmp/test-output/.github/workflows/docs.yml       && echo "ok: docs.yml (enabled)"
          test -f /tmp/test-output/.github/workflows/pr-review.yml  && echo "ok: pr-review.yml (enabled)"
          grep -q "test_project" /tmp/test-output/pyproject.toml && echo "ok: slug in pyproject"
          grep -q "1.0.0" /tmp/test-output/VERSION               && echo "ok: version in VERSION"
          grep -q "teal" /tmp/test-output/mkdocs.yml             && echo "ok: theme in mkdocs"
          grep -q "trusted-publishing automatic" /tmp/test-output/.github/workflows/release.yml     && echo "ok: oidc in release"
          grep -q "uvx --from commitizen cz" /tmp/test-output/.github/workflows/versioning.yml      && echo "ok: cz entrypoint in versioning"
          grep -q "create-github-app-token" /tmp/test-output/.github/workflows/versioning.yml       && echo "ok: adaptive App bump in versioning"
          test -x /tmp/test-output/scripts/setup_repo.sh              && echo "ok: setup_repo.sh (executable)"
          test -x /tmp/test-output/scripts/setup_branch_protection.sh && echo "ok: setup_branch_protection.sh (executable)"
          test -f /tmp/test-output/docs/repository-setup.md          && echo "ok: repository-setup.md"
          test -f /tmp/test-output/.githooks/fix_commit_msg.py && echo "ok: fix_commit_msg.py"
          test -f /tmp/test-output/.gitlint                  && echo "ok: .gitlint"
          grep -q "gitlint" /tmp/test-output/.pre-commit-config.yaml && echo "ok: gitlint in pre-commit"
          echo "Generated project structure valid."

      - name: Check optional features gate off by default
        run: |
          # Same answers minus the enable_* flags → defaults (all off). The
          # optional workflow files must NOT be generated and release.yml must
          # not carry the PyPI publish step or its id-token permission.
          uvx copier copy --vcs-ref HEAD . /tmp/test-output-off --defaults \
            --data "project_name=Test Project" \
            --data "project_slug=test_project" \
            --data "project_description=A test package" \
            --data "author_name=Test Author" \
            --data "author_email=test@example.com" \
            --data "github_username=testuser" \
            --data "github_repo=test-project" \
            --data "year=2026"
          ! test -e /tmp/test-output-off/.github/workflows/docs.yml      && echo "ok: no docs.yml"
          ! test -e /tmp/test-output-off/.github/workflows/pr-review.yml && echo "ok: no pr-review.yml"
          ! grep -q "Publish to PyPI" /tmp/test-output-off/.github/workflows/release.yml && echo "ok: no PyPI step"
          ! grep -q "id-token: write" /tmp/test-output-off/.github/workflows/release.yml && echo "ok: no id-token"
          echo "Optional-feature gating (off) valid."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Run pre-commit (whitespace + gitleaks)
        run: uvx pre-commit run --all-files --show-diff-on-failure

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [validate, lint]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "validate failed" && exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "lint failed" && exit 1
          fi
          echo "All required checks passed."
