name: Renovate

# Dependency updates for this repository's own tooling. Files under template/ are
# copier templates, not manifests, and are ignored in renovate.json.
on:
  # Nightly run; renovate.json's schedule decides when PRs open.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  LOG_LEVEL: debug
  RENOVATE_REPOSITORIES: ${{ github.repository }}  # operate on this repo only

jobs:
  renovate:
    name: Renovate dependency scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      # Adaptive identity: with the CI_BOT_CLIENT_ID variable and the
      # CI_BOT_PRIVATE_KEY secret set, Renovate authors PRs as that GitHub App, and
      # CI runs on them. Otherwise it falls back to GITHUB_TOKEN, whose PRs trigger
      # no workflows (CI must then be re-run by hand) and which needs the repo
      # setting that lets Actions create pull requests.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: ${{ vars.CI_BOT_CLIENT_ID != '' }}
        with:
          client-id: ${{ vars.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}

      - uses: renovatebot/github-action@v46.1.17
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token || github.token }}
